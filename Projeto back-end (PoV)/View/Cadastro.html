<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pov Cadastro </title>
    <link rel="stylesheet" href="../CSS/CSSCadastro.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
</head>
<body>
    <header>
        <div class="header_topo">
            <div class="logo">
                <h2 id="img_logo" onclick="window.location.href='../View/Index.php'">Point of View</h2>
            </div>
            <div class="font-darkmode-controls">
                <button id="toggle-dark" class="toggle-dark" title="Ativar/Desativar Modo Escuro" aria-pressed="false">
                    <i class="bi bi-brightness-high-fill sun"></i>
                    <i class="bi bi-moon-stars moon"></i>
                </button>
                <div class="font-controls">
                    <button id="font-inc" title="Aumentar Fonte">
                        <i class="bi bi-zoom-in"></i>
                    </button>
                    <button id="font-dec" title="Diminuir Fonte">
                        <i class="bi bi-zoom-out"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>
    <div class="cadastro-container">
        <form id="formCadastro" action="../Controladores/cadastro_Control.php" method="post" enctype="multipart/form-data" novalidate>
            <h2>Preencha seus dados</h2>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="CPF" placeholder="Ex: 123.456.789-00">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@servidor.com" required>

            <label for="genero">Gênero:</label>
            <select id="genero" name="sexo" required>
                <option value="">Selecione</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outros">Outros</option>
            </select>

            <label for="dataNasc">Data de nascimento:</label>
            <input type="date" id="dataNasc" name="data_de_nascimento" required>

            <label for="nomemae">Nome da mãe:</label>
            <input type="text" id="nomemae" name="nome_materno" placeholder="Nome da mãe">

            <label for="celular">Telefone celular:</label>
            <input type="tel" id="celular" name="telefone_celular" placeholder="(XX) XXXXX-XXXX">

            <label for="fixo">Telefone fixo:</label>
            <input type="tel" id="fixo" name="telefone_fixo" placeholder="(XX) XXXX-XXXX">

            <label for="endereco">Endereço completo:</label>
            <input type="text" id="endereco" name="endereco" placeholder="Bairro, rua, número e complemento">

            <label for="foto">Foto de perfil (opcional, JPG, PNG ou WebP, até 2 MB):</label>
            <input type="file" id="foto" name="foto" accept="image/jpeg,image/png,image/webp">

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="8" required>

            <label for="senha2">Confirme sua senha:</label>
            <input type="password" id="senha2" name="confirmar" placeholder="Confirme sua senha" required>

            <button type="submit">Cadastrar</button>
            <input type="reset" id="limpar" value="Limpar tela">
        </form>
    </div>
    <!-- Modal de erros de validação -->
    <div id="modalErros" class="modal-erro" aria-hidden="true">
        <div class="modal-erro__overlay" id="modalOverlay"></div>
        <div class="modal-erro__dialog" role="dialog" aria-labelledby="modalErrosTitle" aria-modal="true">
            <h3 id="modalErrosTitle">Erros no formulário</h3>
            <p>Verifique os campos abaixo:</p>
            <ul id="modalErrosList"></ul>
            <div style="text-align:right; margin-top:12px;">
                <button id="modalFechar" class="btn">Fechar</button>
            </div>
        </div>
    </div>
    <br><br><br>
    <footer>
        <hr class="linha-header">
        <div class="footer">
            <lu class="footer-links">
                <li><a href="#">teste</a></li>
                <li><a href="#">teste</a></li>
                <li><a href="#">teste</a></li>
            </lu>
            <div class="footer-text">
                <p>PoV</p>
                <img src="../img/logo.png" alt="imgfooter">
            </div>
            <div class="footer-social">
                <a href="#">teste</a>
                <a href="#">teste</a>
                <a href="#">teste</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>teste</p>
        </div>
    </footer>
    <script src="../JS/JSCadastro.js" defer></script>
    <script>
        const mensagens = {
            dados: 'Verifique nome, e-mail e senha (mínimo de 8 caracteres, iguais nos dois campos).',
            email: 'Este e-mail já está cadastrado.',
            cpf: 'CPF inválido.',
            cpf_duplicado: 'Este CPF já está cadastrado.',
            data: 'Data de nascimento inválida.',
            telefone: 'Telefone inválido (use DDD + número).',
            foto: 'Não foi possível processar a foto de perfil. Tente outra imagem.',
            foto_tipo: 'Formato de foto não permitido. Use JPG, PNG ou WebP.',
            foto_tamanho: 'A foto de perfil deve ter no máximo 2 MB.'
        };
        const erro = new URLSearchParams(location.search).get('erro');
        if (erro) alert(mensagens[erro] || 'Erro ao cadastrar.');
        </script>
    </body>
</html>
