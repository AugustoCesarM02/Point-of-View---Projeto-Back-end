<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Point of View </title>
    <link rel="stylesheet" href="../CSS/CSSCadastro.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
</head>
<body>
    <!-- Cabeçalho: mantém a identidade e os controles que já existiam no projeto -->
    <header class="cabecalho-cadastro">
        <div class="header_topo">
            <a class="logo" href="Index.php" aria-label="Voltar ao início">
                <span>Point <span class="logo-destaque">of</span> View</span>
            </a>

            <div class="font-darkmode-controls">
                <button id="toggle-dark" class="toggle-dark" type="button"
                        title="Ativar/Desativar Modo Escuro" aria-label="Alternar modo escuro"
                        aria-pressed="false">
                    <i class="bi bi-brightness-high-fill sun"></i>
                    <i class="bi bi-moon-stars-fill moon"></i>
                </button>

                <div class="font-controls">
                    <button id="font-inc" type="button" title="Aumentar fonte" aria-label="Aumentar fonte">
                        <i class="bi bi-zoom-in"></i>
                    </button>
                    <button id="font-dec" type="button" title="Diminuir fonte" aria-label="Diminuir fonte">
                        <i class="bi bi-zoom-out"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Área principal com fotografia de fundo -->
    <main class="pagina-cadastro">
        <section class="cadastro-container" aria-labelledby="tituloCadastro">

            <div class="marca-formulario">
                <span class="marca-ponto"></span>
                <span>POINT OF VIEW</span>
            </div>

            <div class="introducao-cadastro">
                <h1 id="tituloCadastro">Crie sua conta</h1>
                <p>Compartilhe seu olhar e descubra novas perspectivas.</p>
            </div>

            <!-- Os nomes dos campos e o action continuam compatíveis com cadastro_Control.php -->
            <form id="formCadastro"
                  action="../Controladores/cadastro_Control.php"
                  method="post"
                  novalidate>

                <div class="grupo-campos">
                    <div class="campo campo-largo">
                        <label class="sr-only" for="nome">Nome completo</label>
                        <i class="bi bi-person" aria-hidden="true"></i>
                        <input type="text" id="nome" name="nome"
                               placeholder="Nome completo" autocomplete="name" required>
                    </div>

                    <div class="campo">
                        <label class="sr-only" for="email">E-mail</label>
                        <i class="bi bi-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" name="email"
                               placeholder="Seu e-mail" autocomplete="email" required>
                    </div>

                    <div class="campo">
                        <label class="sr-only" for="cpf">CPF</label>
                        <i class="bi bi-card-text" aria-hidden="true"></i>
                        <input type="text" id="cpf" name="CPF"
                               placeholder="CPF (opcional)" inputmode="numeric"
                               autocomplete="off" maxlength="14">
                    </div>

                    <div class="campo">
                        <label class="sr-only" for="genero">Gênero</label>
                        <i class="bi bi-person-vcard" aria-hidden="true"></i>
                        <select id="genero" name="sexo">
                            <option value="">Gênero (opcional)</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label class="sr-only" for="dataNasc">Data de nascimento</label>
                        <i class="bi bi-calendar-event" aria-hidden="true"></i>
                        <input type="date" id="dataNasc" name="data_de_nascimento"
                               aria-label="Data de nascimento (opcional)">
                    </div>

                    <div class="campo">
                        <label class="sr-only" for="nomemae">Nome da mãe</label>
                        <i class="bi bi-person-lines-fill" aria-hidden="true"></i>
                        <input type="text" id="nomemae" name="nome_materno"
                               placeholder="Nome da mãe (opcional)">
                    </div>

                    <div class="campo">
                        <label class="sr-only" for="celular">Telefone celular</label>
                        <i class="bi bi-phone" aria-hidden="true"></i>
                        <input type="tel" id="celular" name="telefone_celular"
                               placeholder="Celular (opcional)" inputmode="numeric">
                    </div>

                    <div class="campo">
                        <label class="sr-only" for="fixo">Telefone fixo</label>
                        <i class="bi bi-telephone" aria-hidden="true"></i>
                        <input type="tel" id="fixo" name="telefone_fixo"
                               placeholder="Telefone fixo (opcional)" inputmode="numeric">
                    </div>

                    <div class="campo campo-largo">
                        <label class="sr-only" for="endereco">Endereço completo</label>
                        <i class="bi bi-geo-alt" aria-hidden="true"></i>
                        <input type="text" id="endereco" name="endereco"
                               placeholder="Endereço completo (opcional)" autocomplete="street-address">
                    </div>

                    <div class="campo campo-largo">
                        <label class="sr-only" for="senha">Senha</label>
                        <i class="bi bi-lock" aria-hidden="true"></i>
                        <input type="password" id="senha" name="senha"
                               placeholder="Crie uma senha (mínimo 8 caracteres)"
                               minlength="8" autocomplete="new-password" required>
                        <button class="mostrar-senha" type="button" data-target="senha"
                                aria-label="Mostrar senha">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="campo campo-largo">
                        <label class="sr-only" for="senha2">Confirme sua senha</label>
                        <i class="bi bi-shield-lock" aria-hidden="true"></i>
                        <input type="password" id="senha2" name="confirmar"
                               placeholder="Confirme sua senha"
                               autocomplete="new-password" required>
                        <button class="mostrar-senha" type="button" data-target="senha2"
                                aria-label="Mostrar confirmação da senha">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <p class="aviso-campos">Os campos marcados como opcionais podem ser preenchidos depois.</p>

                <button type="submit" id="cadastrar" class="btn-cadastrar">
                    Criar minha conta
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>

                <p class="login-link">
                    Já possui uma conta?
                    <a href="Login.html">Entrar</a>
                </p>
            </form>
        </section>
    </main>

    <!-- Modal de erros de validação -->
    <div id="modalErros" class="modal-erro" aria-hidden="true">
        <div class="modal-erro__overlay" id="modalOverlay"></div>
        <div class="modal-erro__dialog" role="dialog" aria-labelledby="modalErrosTitle" aria-modal="true">
            <h3 id="modalErrosTitle">Erros no formulário</h3>
            <p>Verifique os campos abaixo:</p>
            <ul id="modalErrosList"></ul>
            <div style="text-align:right; margin-top:12px;">
                <button id="modalFechar" class="btn">Fechar</button>
            </div>
        </div>
        
        <div class="footer-bottom">
            <p>teste</p>
        </div>
    </footer>
    <script src="../JS/JSCadastro.js" defer></script>
    <script>
        const mensagensCadastro = {
            dados: 'Verifique nome, e-mail e senha (mínimo de 8 caracteres, iguais nos dois campos).',
            email: 'Este e-mail já está cadastrado.',
            cpf: 'CPF inválido.',
            cpf_duplicado: 'Este CPF já está cadastrado.',
            data: 'Data de nascimento inválida.',
            telefone: 'Telefone inválido (use DDD + número).',
            foto: 'Não foi possível processar a foto de perfil. Tente outra imagem.',
            foto_tipo: 'Formato de foto não permitido. Use JPG, PNG ou WebP.',
            foto_tamanho: 'A foto de perfil deve ter no máximo 2 MB.'
        };
        const erroCadastro = new URLSearchParams(window. location.search).get('erro');
        if (erroCadastro) alert(mensagensCadastro[erroCadastro] || 'Não foi possível realizar o cadastro. Confira os dados.');
        </script>
    </body>
</html>
