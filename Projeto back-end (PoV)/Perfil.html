<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil</title>

    <link rel="stylesheet" href="CSS/Perfil.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <header>
        <div class="header_topo">
            <div class="logo">
                <h2 id="img_logo"
                    onclick="window.location.href='Index.html'">
                    Point of View
                </h2>
            </div>

            <div class="font-darkmode-controls">
                <button
                    type="button"
                    id="toggle-dark"
                    class="toggle-dark"
                    title="Ativar modo escuro"
                    aria-label="Alternar modo escuro"
                    aria-pressed="false">

                    <i class="bi bi-brightness-high-fill sun"></i>
                    <i class="bi bi-moon-stars moon"></i>
                </button>

                <div class="font-controls">
                    <button
                        type="button"
                        id="font-inc"
                        title="Aumentar fonte"
                        aria-label="Aumentar tamanho da fonte">
                        <i class="bi bi-zoom-in"></i>
                    </button>

                    <button
                        type="button"
                        id="font-dec"
                        title="Diminuir fonte"
                        aria-label="Diminuir tamanho da fonte">
                        <i class="bi bi-zoom-out"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="perfil">
        <h1>Perfil</h1>

        <img
            src="img/Foto de perfil provisória.jpg"
            alt="Foto de perfil"
            class="foto-perfil">

        <section class="sobre">
            <h2>Sobre mim</h2>

            <textarea type="text" id="sobremim" placeholder="Fale um pouco sobre você"></textarea>
        </section>

        <section class="detalhes">
            <h2>Detalhes</h2>

            <div class="nome">
                <strong>Nome</strong>
                <p>Exemplo de nome</p>
            </div>

            <div class="idade">
                <strong>Idade</strong>
                <p>Exemplo de idade</p>
            </div>

            <div class="localizacao">
                <strong>Localização</strong>
                <p>Cidade, País</p>
            </div>
        </section>
    </main>

    <footer>
        <hr class="linha-header">

        <div class="footer">
            <ul class="footer-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Quem somos</a></li>
                <li><a href="#">Categorias</a></li>
            </ul>

            <div class="footer-text">
                <img src="img/logo.png" alt="Imagem do rodapé">
            </div>

            <div class="footer-social">
                <a href="#">Instagram</a>
                <a href="#">X/Twitter</a>
                <a href="#">Facebook</a>
            </div>
        </div>

        <div class="footer-bottom">
            <p>POINT OF VIEW</p>
        </div>
    </footer>

    <script src="JS/Perfil.js"></script>
</body>
</html>
