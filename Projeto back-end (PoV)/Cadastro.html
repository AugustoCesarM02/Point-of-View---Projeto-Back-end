<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | InfoMark</title>
    <link rel="stylesheet" href="CSS/CSSCadastro.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
</head>
<body>
    <header>
        <div class="header-topo">
            <div class="logo">
                <img src="img/Logo_preta.jpg" style="height:80px;" onclick="window.location.href='Index.html'">
            </div>
            <div class="search-barra">
                <input type="search" name="procurar" placeholder="Pesquise o seu produto">
            </div>
            <div class="Login">
                <input type="button" id="login_header" value="Login" onclick="window.location.href='Login.html'">
            </div>
            <div class="Início">
                <input type="button" id="início_header" value="Início" onclick="window.location.href='Index.html'"> 
            </div>
            <div class="font-darkmode-controls">
                <button id="toggle-dark" class="toggle-dark" title="Ativar/Desativar Modo Escuro" aria-pressed="false">
                    <i class="bi bi-brightness-high-fill sun"></i>
                    <i class="bi bi-moon-stars moon"></i>
                </button>
                <div class="font-controls">
                    <button id="font-inc" title="Aumentar Fonte">
                        <i class="bi bi-zoom-in"></i>
                    </button>
                    <button id="font-dec" title="Diminuir Fonte">
                        <i class="bi bi-zoom-out"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>
        <div class="cadastro-container">
            <form id="formCadastro">
                <h2>Preencha seus dados</h2>

                <label>Nome completo:</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>

                <label>CPF:</label>
                <input type="text" id="cpf" placeholder="Ex: 123.456.789-00" required>

                <label>E-mail:</label>
                <input type="email" id="email" placeholder="exemplo@servidor.com" required>

                <label for="genero">Gênero:</label>
                <select id="genero" required>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outros">Outros</option>
                </select>

                <label>Data de nascimento:</label>
                <input type="date" id="dataNasc" required>
                
                <label for="mae">Nome da mãe:</label>
                <input type="text" id="nomemae" placeholder="Nome da mãe" required>

                <label>Telefone celular:</label>
                <input type="number" id="celular" placeholder="(XX) 9XXXX-XXXX" required>

                <label>Telefone fixo:</label>
                <input type="number" id="fixo" placeholder="(XX) XXXX-XXXX" required>

                <label>Endereço completo:</label>
                <input type="text" id="endereco" placeholder="Bairro, rua, número e complemento" required>

                <label>Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha" minlength="6" required>

                <label>Confirme sua senha:</label>
                <input type="password" id="senha2" placeholder="Confirme sua senha" required>

                <input type="button" id="cadastrar" value="Cadastrar" onclick="salvartudo()">
                <input type="reset" id="limpar" value="Limpar tela">
            </form>
        </div>
        <!-- Modal de erros de validação -->
        <div id="modalErros" class="modal-erro" aria-hidden="true">
            <div class="modal-erro__overlay" id="modalOverlay"></div>
            <div class="modal-erro__dialog" role="dialog" aria-labelledby="modalErrosTitle" aria-modal="true">
                <h3 id="modalErrosTitle">Erros no formulário</h3>
                <p>Verifique os campos abaixo:</p>
                <ul id="modalErrosList"></ul>
                <div style="text-align:right; margin-top:12px;">
                    <button id="modalFechar" class="btn">Fechar</button>
                </div>
            </div>
        </div>
            <br><br><br>
        </form>
            <div class="rodape">
            <br>
            <div class="formaspagamento-seguranca">
                <div class="formaspagamento">
                    <img src="img/PIX.jpg" alt="Pix" >
                    <img src="img/card_11378185.png" alt="Mastercard" >
                    <img src="img/visa (1).png" alt="visa" >
                    <img src="img/Boleto.png.jpg" alt="boleto" >
                    <img src="img/nubank.png" alt="nubank" >
                </div>
                <div class="Siganos">
                <img src="img/twitter (1).png" alt="Twitter ou X" style="width: 10%;" onclick="window.location.href='algumlugar'">
                <img src="img/facebook (2).png" alt="Facebook" style="width: 10%;" onclick="window.location.href='algumlugar'">
                <img src="img/youtube (1).png" alt="Youtube" style="width: 10%;" onclick="window.location.href='algumlugar'">
                <img src="img/telegram (2).png" alt="Telegran" style="width: 10%;" onclick="window.location.href='algumlugar'">
                <img src="img/discord (1).png" alt="Discord" style="width: 10%;" onclick="window.location.href='algumlugar'">
            </div>
            </div>
        </div>
        <script src="JS/JSCadastro.js" defer></script>
    </body>
</html>
